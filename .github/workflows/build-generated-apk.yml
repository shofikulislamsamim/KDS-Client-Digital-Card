name: Build KDS Digital Card APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Android app name"
        required: true
        type: string
      card_url:
        description: "Card URL"
        required: true
        type: string
      profile:
        description: "Profile mode"
        required: true
        type: choice
        options: [personal, business, personal_business]
      package_id:
        description: "Android package ID"
        required: true
        type: string
      internal_app_id:
        description: "Internal app ID"
        required: true
        type: string
      splash_title:
        description: "Splash title"
        required: true
        type: string
      splash_bg_color:
        description: "Splash background hex color"
        required: true
        type: string
      icon_url:
        description: "Launcher icon image URL or data URL"
        required: false
        type: string
      safe_file_name:
        description: "APK file base name"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Create Android project
        env:
          APP_NAME: ${{ inputs.app_name }}
          CARD_URL: ${{ inputs.card_url }}
          PROFILE: ${{ inputs.profile }}
          PACKAGE_ID: ${{ inputs.package_id }}
          INTERNAL_APP_ID: ${{ inputs.internal_app_id }}
          SPLASH_TITLE: ${{ inputs.splash_title }}
          SPLASH_BG_COLOR: ${{ inputs.splash_bg_color }}
          ICON_URL: ${{ inputs.icon_url }}
        shell: bash
        run: |
          set -euo pipefail

          # Decode launcher metadata from the existing splash_title input.
          if [[ "$SPLASH_TITLE" == KDSMETA:* ]]; then
            META="${SPLASH_TITLE#KDSMETA:}"
            ICON_B64="${META%%:*}"
            TITLE_B64="${META#*:}"
            if [[ -n "$ICON_B64" ]]; then
              ICON_URL="$(printf '%s' "$ICON_B64" | base64 --decode 2>/dev/null || true)"
            fi
            if [[ -n "$TITLE_B64" ]]; then
              SPLASH_TITLE="$(printf '%s' "$TITLE_B64" | base64 --decode 2>/dev/null || true)"
            fi
          fi

          rm -rf generated-apk
          mkdir -p generated-apk/app/src/main/java generated-apk/app/src/main/res/values generated-apk/app/src/main/res/drawable generated-apk/app/src/main/res/mipmap-anydpi-v26 generated-apk/app/src/main/res/mipmap-xxxhdpi
          PACKAGE_PATH="${PACKAGE_ID//./\/}"
          mkdir -p "generated-apk/app/src/main/java/$PACKAGE_PATH"

          cat > generated-apk/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "KDSGeneratedCard"
          include(":app")
          EOF

          cat > generated-apk/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.2' apply false
          }
          EOF

          cat > generated-apk/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > generated-apk/app/build.gradle <<EOF
          plugins { id 'com.android.application' }
          android {
              namespace '$PACKAGE_ID'
              compileSdk 35
              defaultConfig {
                  applicationId '$PACKAGE_ID'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }
              buildTypes {
                  release { minifyEnabled false; shrinkResources false }
              }
          }
          EOF

          # Resolve and fit the selected client logo/profile image for Android launcher icons.
          # The source image is cropped only when it has transparent margins, then scaled large
          # enough to use the adaptive icon safe area without distorting its aspect ratio.
          ICON_SOURCE="$ICON_URL"
          ICON_RAW="/tmp/kds-icon-source"
          ICON_FG="generated-apk/app/src/main/res/drawable/ic_launcher_foreground.png"
          ICON_LEGACY="generated-apk/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"

          if [[ -n "$ICON_SOURCE" ]]; then
            if [[ "$ICON_SOURCE" == data:image/* ]]; then
              ICON_B64="${ICON_SOURCE#*,}"
              printf '%s' "$ICON_B64" | base64 --decode > "$ICON_RAW" || rm -f "$ICON_RAW"
            elif [[ "$ICON_SOURCE" =~ ^https?:// ]]; then
              curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 "$ICON_SOURCE" -o "$ICON_RAW" || rm -f "$ICON_RAW"
            fi
          fi

          if [[ -s "$ICON_RAW" ]]; then
            # Normalize PNG/JPEG/WebP/etc. to PNG first.
            magick "$ICON_RAW" -auto-orient -strip /tmp/kds-icon-normalized.png

            CHANNELS="$(magick identify -format '%[channels]' /tmp/kds-icon-normalized.png 2>/dev/null || true)"
            if [[ "$CHANNELS" == *a* || "$CHANNELS" == *A* ]]; then
              # Remove transparent outer padding so the actual logo can fill the icon.
              magick /tmp/kds-icon-normalized.png -trim +repage /tmp/kds-icon-trimmed.png
            else
              cp /tmp/kds-icon-normalized.png /tmp/kds-icon-trimmed.png
            fi

            # 78% of the adaptive-icon canvas gives a substantially larger logo while
            # keeping it inside the launcher mask/safe area in normal Android launchers.
            magick /tmp/kds-icon-trimmed.png               -resize '78%x78%'               -gravity center               -background none               -extent 1080x1080               "$ICON_FG"

            # Legacy launchers/API levels use the same properly fitted square icon.
            magick "$ICON_FG" -resize 432x432 "$ICON_LEGACY"

            cat > generated-apk/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

            cp generated-apk/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml               generated-apk/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          else
            # Fallback icon when no client image is available.
            cat > generated-apk/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
            cp generated-apk/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml               generated-apk/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

            cat > generated-apk/app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#38BDF8" android:pathData="M24,30h60v12h-60zM24,48h60v12h-60zM24,66h36v12h-36z" />
          </vector>
          EOF
            magick -size 432x432 xc:"$SPLASH_BG_COLOR" "$ICON_LEGACY"
          fi

          cat > generated-apk/app/src/main/AndroidManifest.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:usesCleartextTraffic="true"
                  android:label="$APP_NAME"
                  android:theme="@style/AppTheme"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > generated-apk/app/src/main/res/values/colors.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="splash_bg">$SPLASH_BG_COLOR</color>
              <color name="ic_launcher_background">$SPLASH_BG_COLOR</color>
          </resources>
          EOF

          cat > generated-apk/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@color/splash_bg</item>
                  <item name="android:navigationBarColor">@color/splash_bg</item>
              </style>
          </resources>
          EOF

          cat > "generated-apk/app/src/main/java/$PACKAGE_PATH/MainActivity.java" <<EOF
          package $PACKAGE_ID;

          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.Intent;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              private WebView webView;
              private FrameLayout root;
              private View splash;
              private static final String CARD_URL = "$CARD_URL";
              private static final String SPLASH_TITLE = "$SPLASH_TITLE";
              private static final int SPLASH_COLOR = Color.parseColor("$SPLASH_BG_COLOR");

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  root = new FrameLayout(this);
                  root.setBackgroundColor(SPLASH_COLOR);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setSupportZoom(false);
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          return handleExternalUrl(request.getUrl());
                      }

                      @Override public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          return handleExternalUrl(Uri.parse(url));
                      }

                      @Override public void onPageFinished(WebView view, String url) { hideSplash(); }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  root.addView(webView, new FrameLayout.LayoutParams(-1, -1));
                  splash = createSplash();
                  root.addView(splash, new FrameLayout.LayoutParams(-1, -1));
                  setContentView(root);
                  webView.loadUrl(CARD_URL);
                  splash.postDelayed(this::hideSplash, 5000);
              }

              /**
               * Opens phone actions and social links with the appropriate Android app.
               * If the app is not installed, falls back to the normal web URL where possible.
               */
              private boolean handleExternalUrl(Uri uri) {
                  if (uri == null) return false;
                  String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase();
                  String host = uri.getHost() == null ? "" : uri.getHost().toLowerCase();

                  try {
                      if ("tel".equals(scheme)) {
                          startActivity(new Intent(Intent.ACTION_DIAL, uri));
                          return true;
                      }

                      if ("mailto".equals(scheme)) {
                          startActivity(new Intent(Intent.ACTION_SENDTO, uri));
                          return true;
                      }

                      if ("sms".equals(scheme) || "smsto".equals(scheme)) {
                          startActivity(new Intent(Intent.ACTION_SENDTO, uri));
                          return true;
                      }

                      if ("whatsapp".equals(scheme)) {
                          Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                          intent.setPackage("com.whatsapp");
                          startActivity(intent);
                          return true;
                      }

                      if ("fb".equals(scheme)) {
                          Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                          intent.setPackage("com.facebook.katana");
                          startActivity(intent);
                          return true;
                      }

                      if ("instagram".equals(scheme)) {
                          Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                          intent.setPackage("com.instagram.android");
                          startActivity(intent);
                          return true;
                      }

                      if ("vnd.youtube".equals(scheme)) {
                          Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                          intent.setPackage("com.google.android.youtube");
                          startActivity(intent);
                          return true;
                      }

                      if ("linkedin".equals(scheme)) {
                          Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                          intent.setPackage("com.linkedin.android");
                          startActivity(intent);
                          return true;
                      }

                      if ("tiktok".equals(scheme)) {
                          Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                          intent.setPackage("com.zhiliaoapp.musically");
                          startActivity(intent);
                          return true;
                      }

                      if ("http".equals(scheme) || "https".equals(scheme)) {
                          boolean social = host.equals("facebook.com") || host.endsWith(".facebook.com")
                              || host.equals("fb.watch") || host.endsWith(".fb.watch")
                              || host.equals("instagram.com") || host.endsWith(".instagram.com")
                              || host.equals("youtube.com") || host.endsWith(".youtube.com")
                              || host.equals("youtu.be")
                              || host.equals("linkedin.com") || host.endsWith(".linkedin.com")
                              || host.equals("tiktok.com") || host.endsWith(".tiktok.com")
                              || host.equals("wa.me") || host.endsWith(".wa.me")
                              || host.equals("api.whatsapp.com") || host.endsWith(".whatsapp.com");

                          if (social) {
                              Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                              String packageName = null;
                              if (host.equals("wa.me") || host.endsWith(".wa.me") || host.equals("api.whatsapp.com") || host.endsWith(".whatsapp.com")) {
                                  packageName = "com.whatsapp";
                              } else if (host.equals("facebook.com") || host.endsWith(".facebook.com") || host.equals("fb.watch") || host.endsWith(".fb.watch")) {
                                  packageName = "com.facebook.katana";
                              } else if (host.equals("instagram.com") || host.endsWith(".instagram.com")) {
                                  packageName = "com.instagram.android";
                              } else if (host.equals("youtube.com") || host.endsWith(".youtube.com") || host.equals("youtu.be")) {
                                  packageName = "com.google.android.youtube";
                              } else if (host.equals("linkedin.com") || host.endsWith(".linkedin.com")) {
                                  packageName = "com.linkedin.android";
                              } else if (host.equals("tiktok.com") || host.endsWith(".tiktok.com")) {
                                  packageName = "com.zhiliaoapp.musically";
                              }

                              if (packageName != null) intent.setPackage(packageName);

                              try {
                                  startActivity(intent);
                              } catch (ActivityNotFoundException ignored) {
                                  // App is not installed: open the HTTPS URL in the default browser.
                                  Intent browser = new Intent(Intent.ACTION_VIEW, uri);
                                  startActivity(browser);
                              }
                              return true;
                          }
                      }
                  } catch (ActivityNotFoundException ignored) {
                      if ("http".equals(scheme) || "https".equals(scheme)) {
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, uri));
                              return true;
                          } catch (ActivityNotFoundException ignoredAgain) {
                              return false;
                          }
                      }
                  }

                  return false;
              }

              private View createSplash() {
                  FrameLayout box = new FrameLayout(this);
                  box.setBackgroundColor(SPLASH_COLOR);
                  TextView title = new TextView(this);
                  title.setText(SPLASH_TITLE);
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(22);
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(null, android.graphics.Typeface.BOLD);
                  FrameLayout.LayoutParams p = new FrameLayout.LayoutParams(-1, -2);
                  p.gravity = Gravity.CENTER;
                  p.leftMargin = 24; p.rightMargin = 24;
                  box.addView(title, p);
                  return box;
              }

              private void hideSplash() {
                  if (splash != null) {
                      View old = splash;
                      splash = null;
                      old.animate().alpha(0f).setDuration(250).withEndAction(() -> root.removeView(old)).start();
                  }
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack(); else super.onBackPressed();
              }

              @Override protected void onDestroy() {
                  if (webView != null) {
                      webView.loadUrl("about:blank");
                      webView.stopLoading();
                      webView.setWebChromeClient(null);
                      webView.setWebViewClient(null);
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build real APK
        working-directory: generated-apk
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify installable APK
        working-directory: generated-apk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -40

      - name: Rename APK
        env:
          SAFE_FILE_NAME: ${{ inputs.safe_file_name }}
        working-directory: generated-apk
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "KDS-$SAFE_FILE_NAME.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: kds-installable-apk
          path: generated-apk/KDS-*.apk
          if-no-files-found: error
          retention-days: 7
