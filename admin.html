<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Client Management • KDS</title><link rel="stylesheet" href="css/style.css"></head><body><header class="topbar"><a class="brand" href="index.html">KDS <span>Client Digital Card</span></a><a class="ghost" href="index.html">Home</a></header><main class="admin-wrap"><section class="panel"><div class="panel-head"><div><div class="eyebrow">CLIENT MANAGEMENT</div><h1 id="formTitle">New Client</h1></div><button id="resetBtn" class="ghost-btn" type="button">Reset</button></div><form id="clientForm"><input type="hidden" id="clientId"><input type="hidden" id="template"><div class="template-pick"><button type="button" data-template="personal">👤 Personal</button><button type="button" data-template="business">👤＋ Personal + Business</button></div><div class="grid"><label>Client name<input id="name" required placeholder="e.g. Rahim Ahmed"></label><label>Designation<input id="designation" placeholder="e.g. Managing Director"></label><label>Phone<input id="phone" placeholder="01XXXXXXXXX"></label><label>WhatsApp<input id="whatsapp" placeholder="01XXXXXXXXX"></label><label>Email<input id="email" type="email" placeholder="name@example.com"></label><label>Location<input id="location" placeholder="City, Bangladesh"></label><label class="wide">Short bio<textarea id="bio" rows="3" placeholder="A short professional introduction"></textarea></label></div><div id="businessFields" class="hidden"><h3>Business Information</h3><div class="grid"><label>Company / Business Name<input id="company" placeholder="Company name"></label><label>Business Tagline<input id="tagline" placeholder="Your tagline"></label><label class="wide">Services<textarea id="services" rows="3" placeholder="Digital Marketing, Graphic Design, Web Development"></textarea></label></div></div><div class="grid"><label>Profile Photo URL<input id="photo" placeholder="https://..."></label><label>Cover Photo URL<input id="cover" placeholder="https://..."></label><label class="wide">Facebook URL<input id="facebook" placeholder="https://facebook.com/..."></label><label>Instagram URL<input id="instagram" placeholder="https://instagram.com/..."></label><label>LinkedIn URL<input id="linkedin" placeholder="https://linkedin.com/in/..."></label><label>YouTube URL<input id="youtube" placeholder="https://youtube.com/@..."></label></div><button class="btn primary full" type="submit">Save Client</button></form></section><section class="panel"><div class="panel-head"><div><div class="eyebrow">CLIENTS</div><h2>Your Cards</h2></div></div><div id="clientList" class="client-list"></div></section></main><script src="js/app.js"></script><script src="js/admin.js"></script></body></html>
